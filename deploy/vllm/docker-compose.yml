# STATUS: not executed here (no GPU, no Docker on the build machine).
services:
  vllm:
    image: vllm/vllm-openai:latest   # pin a released tag for real use
    working_dir: /app
    command: ["--config", "/app/config.yaml"]
    ports: ["8000:8000"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ../../models/triage-lora:/app/models/triage-lora:ro
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
volumes:
  hf-cache: {}
